<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#062d19">
<title>North Wilts Live Scores</title>
<link rel="icon" type="image/png" href="nwwl-logo.png">
<style>
:root{--green:#062d19;--mid:#168c3b;--lime:#70ff42;--bg:#eef3ec;--ink:#142019;--muted:#66736b;--line:#d7e1d8}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.3 Calibri,"Segoe UI",Arial,sans-serif;-webkit-tap-highlight-color:transparent}.topbar{display:flex;align-items:center;gap:10px;min-height:64px;padding:8px max(12px,env(safe-area-inset-left));color:#fff;background:linear-gradient(135deg,#031b0e,#07512b);border-bottom:2px solid var(--lime)}.logo{display:block;width:42px;height:42px;flex:0 0 auto;object-fit:cover;border:1px solid #70ff4277;border-radius:11px}.brand b{display:block;font-size:17px}.brand small{display:block;color:#b8eeb0;font-size:11px;letter-spacing:.06em;text-transform:uppercase}.page{width:min(620px,100%);margin:auto;padding:16px 12px 28px}.heading{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:9px}.heading h1{margin:0;color:var(--green);font-size:25px;line-height:1}.status{margin:0;color:var(--muted);font-size:12px;text-align:right}.columns{display:grid;grid-template-columns:minmax(0,1fr) 54px 54px;gap:6px;align-items:end;margin:0 0 5px;padding:0 8px;color:var(--muted);font-size:11px;font-weight:800;text-transform:uppercase}.columns span{text-align:center}.list{display:grid;gap:5px}.card{overflow:hidden;border:1px solid var(--line);border-radius:8px;background:#f8faf7}.player{display:grid;width:100%;grid-template-columns:26px minmax(0,1fr) 54px 54px;gap:6px;align-items:center;min-height:34px;padding:4px 8px;border:0;background:transparent;color:var(--ink);font:inherit;text-align:left;cursor:pointer}.player.open{background:#eef7eb}.pos{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#e3f1df;color:var(--green);font-size:12px;font-weight:900}.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:900}.stat{text-align:center}.stat b{display:block;font-size:16px;line-height:1}.scorecard{padding:4px;border-top:1px solid var(--line);background:#fff}.hidden{display:none!important}.nine{width:100%;table-layout:fixed;border-collapse:collapse;margin:0 0 4px}.nine:last-child{margin-bottom:0}.nine th,.nine td{padding:2px 1px;border:1px solid #e2e9e2;background:#fff;text-align:center;font-size:10px;line-height:1.1;font-weight:700}.nine th:first-child,.nine td:first-child{width:34px;background:#edf3ea;text-align:left;font-weight:900}.empty{padding:22px 12px;text-align:center;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:10px}.loading{padding:3px;color:var(--muted);font-size:11px}@media(max-width:370px){.brand small{display:none}.heading h1{font-size:22px}.page{padding-left:8px;padding-right:8px}}
.columns span{font:800 11px/1.3 Calibri,"Segoe UI",Arial,sans-serif}.columns span:first-child{padding-left:32px;text-align:left}
.topbar .brand{min-width:0;flex:1}.brand-line{display:flex;align-items:baseline;justify-content:space-between;gap:10px}.topbar .status{margin:0;color:#b8eeb0;font:800 12px/1 Calibri,"Segoe UI",Arial,sans-serif;letter-spacing:.04em;text-align:right}.heading{display:block}
.logo{background:url('nwwl-logo.png') center/cover no-repeat;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
.admin-round{position:relative;overflow:hidden;border:1px solid #d9b3b1;border-radius:11px;background:#fff}.admin-round-head{padding:10px 52px 8px 11px;background:#fff7f6}.admin-round-head b{display:block;color:var(--green);font-size:14px}.admin-round-head small{color:var(--muted);font-size:12px}.admin-round .admin-x{position:absolute;top:0;right:0;height:47px;border-bottom:1px solid #efc5c5;border-radius:0 10px 0 9px}.admin-cols,.admin-player{display:grid;grid-template-columns:minmax(0,1fr) 54px 54px;gap:6px;align-items:center}.admin-cols{padding:7px 9px 3px;color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase}.admin-cols span:not(:first-child),.admin-player span:not(:first-child){text-align:center}.admin-player{padding:8px 9px;border-top:1px solid #edf0ed}.admin-player b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.admin-player strong{font-size:16px}
.row-wrap{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:stretch}.admin-x{width:42px;border:0;border-left:1px solid #efc5c5;background:#fff0f0;color:#b32020;font-size:26px;font-weight:900;cursor:pointer}.exit-admin{width:100%;margin-top:12px;padding:12px;border:1px solid #b32020;border-radius:9px;background:#fff;color:#b32020;font:900 15px Calibri,"Segoe UI",Arial,sans-serif;cursor:pointer}.admin-status{color:#ffb5b5!important}dialog{width:min(390px,calc(100% - 24px));padding:0;border:0;border-radius:18px;background:#fff;color:var(--ink);box-shadow:0 20px 70px #001a0d66}dialog::backdrop{background:#02160cb8}.dialog-head{padding:18px 20px 10px;color:var(--green);font-size:21px;font-weight:900}.dialog-body{padding:8px 20px 20px}.pin-dots{display:flex;justify-content:center;gap:13px;margin:9px 0 19px}.pin-dot{width:13px;height:13px;border:2px solid #789082;border-radius:50%;background:#fff}.pin-dot.filled{border-color:var(--green);background:var(--green)}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.key{min-height:54px;border:1px solid #cddbd0;border-radius:12px;background:#f5f8f4;color:var(--green);font:900 22px Calibri,"Segoe UI",Arial,sans-serif}.key.blank{visibility:hidden}.dialog-actions{display:flex;gap:9px;margin-top:15px}.dialog-actions button{flex:1;min-height:45px;border:0;border-radius:10px;font:900 14px Calibri,"Segoe UI",Arial,sans-serif}.cancel{background:#edf2ed;color:var(--green)}.danger{background:#b32020;color:#fff}.error{min-height:20px;margin:8px 0 0;color:#b32020;text-align:center;font-size:13px;font-weight:800}
</style>
</head>
<body>
<header class="topbar"><div class="logo" id="adminLogo" role="button" tabindex="0" aria-label="Admin login"></div><div class="brand"><b>Live Scores</b><div class="brand-line"><small>North Wilts Winter League</small><p class="status" id="status">--:--:--</p></div></div></header>
<main class="page">
  <div class="heading"><h1>Today’s leaderboard</h1></div>
  <div class="columns"><span>Player</span><span>Holes</span><span>Points</span></div>
  <div class="list" id="list"></div>
</main>
<dialog id="adminLogin"><div class="dialog-head">Admin Login</div><div class="dialog-body"><div class="pin-dots" id="pinDots" aria-label="0 of 6 digits entered"></div><div class="keypad" id="keypad"><button class="key" data-digit="1">1</button><button class="key" data-digit="2">2</button><button class="key" data-digit="3">3</button><button class="key" data-digit="4">4</button><button class="key" data-digit="5">5</button><button class="key" data-digit="6">6</button><button class="key" data-digit="7">7</button><button class="key" data-digit="8">8</button><button class="key" data-digit="9">9</button><button class="key blank" tabindex="-1"></button><button class="key" data-digit="0">0</button><button class="key" data-action="back" aria-label="Delete last digit">⌫</button></div><div class="error" id="loginError"></div><div class="dialog-actions"><button class="cancel" id="cancelLogin">Cancel</button></div></div></dialog>
<dialog id="adminAbandon"><div class="dialog-head">Abandon round?</div><div class="dialog-body"><p id="abandonText"></p><div class="error" id="abandonError"></div><div class="dialog-actions"><button class="cancel" id="cancelAbandon">Cancel</button><button class="danger" id="confirmAbandon">ABANDON</button></div></div></dialog>
<script>
const API='https://nwwl-scorecard-api.ders-c54.workers.dev',list=document.querySelector('#list'),statusText=document.querySelector('#status');let expanded=null,playersCache=[],adminMode=false,adminPin='',pinEntry='',pendingRoundId=null;
const escapeHtml=value=>String(value).replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
function todayKey(){const now=new Date(),pad=value=>String(value).padStart(2,'0');return `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`}
function table(scores,start){const byHole=new Map(scores.map(score=>[Number(score.hole),score])),holes=Array.from({length:9},(_,index)=>start+index),row=(label,key)=>`<tr><th>${label}</th>${holes.map(hole=>`<td>${byHole.get(hole)?.[key]??'—'}</td>`).join('')}</tr>`;return `<table class="nine"><tbody><tr><th>Hole</th>${holes.map(hole=>`<th>${hole}</th>`).join('')}</tr>${row('Gross','gross')}${row('Pts','points')}</tbody></table>`}
function detail(key){const row=[...document.querySelectorAll('.player')].find(item=>item.dataset.key===key);return {row,panel:row?.closest('.card')?.querySelector('.scorecard')}}
async function loadCard(row){const key=row.dataset.key,{panel}=detail(key);if(!panel)return;panel.innerHTML='<div class="loading">Loading scorecard…</div>';try{const response=await fetch(`${API}/rounds/${encodeURIComponent(row.dataset.round)}/players/${row.dataset.player}`,{cache:'no-store'}),data=await response.json();if(!response.ok)throw new Error();if(expanded===key){const current=detail(key).panel;if(current)current.innerHTML=table(data.player.scores||[],1)+table(data.player.scores||[],10)}}catch{if(expanded===key){const current=detail(key).panel;if(current)current.innerHTML='<div class="loading">Scorecard could not be loaded.</div>'}}}
function formatStart(value){const date=new Date(value),pad=number=>String(number).padStart(2,'0');return Number.isNaN(date.getTime())?'—':`${pad(date.getDate())}/${pad(date.getMonth()+1)} ${pad(date.getHours())}:${pad(date.getMinutes())}`}
function renderAdmin(players){const rounds=new Map();players.forEach(player=>{if(!rounds.has(player.roundId))rounds.set(player.roundId,{roundId:player.roundId,createdAt:player.createdAt,players:[]});rounds.get(player.roundId).players.push(player)});return [...rounds.values()].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)).map(item=>`<section class="admin-round"><div class="admin-round-head"><b>${item.players.length}-PLAYER SCORECARD</b><small>Started ${formatStart(item.createdAt)}</small></div><button class="admin-x" type="button" data-admin-round="${escapeHtml(item.roundId)}" aria-label="Abandon this scorecard">×</button><div class="admin-cols"><span>Player</span><span>Holes</span><span>Points</span></div>${item.players.map(player=>`<div class="admin-player"><b>${escapeHtml(player.name)}</b><span><strong>${player.holesCompleted}</strong></span><span><strong>${player.points}</strong></span></div>`).join('')}</section>`).join('')}
function render(players){playersCache=players;if(adminMode){expanded=null;const rounds=renderAdmin(players);list.innerHTML=(rounds||'<div class="empty">No current rounds in progress.</div>')+'<button type="button" class="exit-admin" id="exitAdmin">Exit Admin</button>';return}const cards=players.map((player,index)=>{const key=`${player.roundId}:${player.playerIndex}`;return `<div class="card"><button class="player" type="button" data-key="${escapeHtml(key)}" data-round="${escapeHtml(player.roundId)}" data-player="${player.playerIndex}" aria-expanded="false"><span class="pos">${index+1}</span><span class="name">${escapeHtml(player.name)}</span><span class="stat"><b>${player.holesCompleted}</b></span><span class="stat"><b>${player.points}</b></span></button><div class="scorecard hidden"></div></div>`}).join('');list.innerHTML=cards||'<div class="empty">No current rounds in progress.</div>';if(expanded){const {row,panel}=detail(expanded);if(row&&panel){row.classList.add('open');row.setAttribute('aria-expanded','true');panel.classList.remove('hidden');loadCard(row)}else expanded=null}}
async function refresh(){try{const response=await fetch(`${API}/leaderboard?date=${todayKey()}`,{cache:'no-store'}),data=await response.json();if(!response.ok)throw new Error();render(Array.isArray(data.players)?data.players:[]);statusText.textContent=adminMode?'ADMIN':new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'});statusText.classList.toggle('admin-status',adminMode)}catch{statusText.textContent=adminMode?'ADMIN':'--:--:--';if(!list.children.length)list.innerHTML='<div class="empty">Scores could not be loaded.</div>'}}
list.addEventListener('click',event=>{if(event.target.closest('#exitAdmin')){adminMode=false;adminPin='';statusText.classList.remove('admin-status');render(playersCache);return}const adminX=event.target.closest('.admin-x');if(adminX){pendingRoundId=adminX.dataset.adminRound;const names=playersCache.filter(player=>player.roundId===pendingRoundId).map(player=>player.name);document.querySelector('#abandonText').textContent=`Abandon the active round for ${names.join(', ')}? This will stop every device using this scorecard.`;document.querySelector('#abandonError').textContent='';document.querySelector('#adminAbandon').showModal();return}const row=event.target.closest('.player');if(!row)return;const key=row.dataset.key;if(expanded===key){expanded=null;row.classList.remove('open');row.setAttribute('aria-expanded','false');row.closest('.card').querySelector('.scorecard').classList.add('hidden');return}document.querySelectorAll('.player.open').forEach(item=>{item.classList.remove('open');item.setAttribute('aria-expanded','false');item.closest('.card').querySelector('.scorecard').classList.add('hidden')});expanded=key;row.classList.add('open');row.setAttribute('aria-expanded','true');row.closest('.card').querySelector('.scorecard').classList.remove('hidden');loadCard(row)});
const loginDialog=document.querySelector('#adminLogin'),abandonDialog=document.querySelector('#adminAbandon');function drawDots(){document.querySelector('#pinDots').innerHTML=Array.from({length:6},(_,index)=>`<span class="pin-dot ${index<pinEntry.length?'filled':''}"></span>`);document.querySelector('#pinDots').setAttribute('aria-label',`${pinEntry.length} of 6 digits entered`)}function openLogin(){if(adminMode)return;pinEntry='';document.querySelector('#loginError').textContent='';drawDots();loginDialog.showModal()}function closeLogin(){pinEntry='';if(loginDialog.open)loginDialog.close()}async function submitPin(){const entered=pinEntry;document.querySelector('#loginError').textContent='Checking…';try{const response=await fetch(`${API}/admin/login`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:entered})}),data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'Admin login failed.');adminMode=true;adminPin=entered;closeLogin();statusText.classList.add('admin-status');statusText.textContent='ADMIN';render(playersCache)}catch(error){document.querySelector('#loginError').textContent=error.message;pinEntry='';drawDots()}}document.querySelector('#keypad').addEventListener('click',event=>{const key=event.target.closest('.key');if(!key)return;if(key.dataset.action==='back')pinEntry=pinEntry.slice(0,-1);else if(key.dataset.digit&&pinEntry.length<6)pinEntry+=key.dataset.digit;drawDots();if(pinEntry.length===6)submitPin()});document.querySelector('#cancelLogin').addEventListener('click',closeLogin);loginDialog.addEventListener('cancel',event=>{event.preventDefault();closeLogin()});
function closeAbandon(){pendingRoundId=null;if(abandonDialog.open)abandonDialog.close()}document.querySelector('#cancelAbandon').addEventListener('click',closeAbandon);abandonDialog.addEventListener('cancel',event=>{event.preventDefault();closeAbandon()});document.querySelector('#confirmAbandon').addEventListener('click',async()=>{if(!pendingRoundId)return;const button=document.querySelector('#confirmAbandon');button.disabled=true;document.querySelector('#abandonError').textContent='';try{const response=await fetch(`${API}/rounds/${encodeURIComponent(pendingRoundId)}/admin-abandon`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:adminPin})}),data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'Round could not be abandoned.');closeAbandon();expanded=null;await refresh()}catch(error){document.querySelector('#abandonError').textContent=error.message}finally{button.disabled=false}});
const adminLogo=document.querySelector('#adminLogo');let holdTimer=null;function startHold(event){if(event.type==='keydown'&&event.key!=='Enter'&&event.key!==' ')return;if(event.type==='keydown'&&event.repeat)return;event.preventDefault();clearTimeout(holdTimer);holdTimer=setTimeout(openLogin,1000)}function cancelHold(){clearTimeout(holdTimer);holdTimer=null}adminLogo.addEventListener('pointerdown',startHold);['pointerup','pointerleave','pointercancel'].forEach(type=>adminLogo.addEventListener(type,cancelHold));adminLogo.addEventListener('keydown',startHold);adminLogo.addEventListener('keyup',cancelHold);adminLogo.addEventListener('contextmenu',event=>event.preventDefault());adminLogo.addEventListener('dragstart',event=>event.preventDefault());
refresh();setInterval(refresh,10000);
</script>
</body>
</html>
